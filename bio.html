<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerson Black | YA Mystery Thrillers</title>
    <!-- S11 §11.3c — this page is now a REDIRECT to the homepage's #about section.

         WHY A REDIRECT RATHER THAN A DELETE. The about copy was folded into the
         homepage (#about), which is where the nav's "About" link points. But
         /bio.html is a live URL: it is in the sitemap, and an agent or reader may
         already have it bookmarked or in a query. Deleting it turns a working
         page into a 404. A redirect answers the same request and lands them
         exactly where that content now lives.

         A META REFRESH is the only redirect available here — this is a static host
         on GitHub Pages, with no .htaccess and no server to issue a real 301. So
         this is a 302-equivalent, not a 301. noindex keeps the duplicate out of
         search results so it cannot compete with the homepage it points at.

         The <noscript> link matters: a meta refresh that a crawler ignores would
         otherwise show an empty page with no way out.

         The footer's "bio.html" link is kept deliberately, for the same reason —
         it is a visible, working escape hatch to this redirect. -->
    <meta http-equiv="refresh" content="0; url=/#about">
    <link rel="canonical" href="https://emersonblackwrites.com/#about">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="redirect-page">
    <div class="redirect-card">
        <p class="wordmark-name">Emerson Black</p>
        <p>This page has moved. Taking you to the about section&hellip;</p>
        <p><a class="btn-primary" href="/#about">Go there now</a></p>
        <noscript>
            <p>If nothing happened, <a href="/#about">click here to read about Emerson Black</a>.</p>
        </noscript>
    </div>
</body>
</html>
