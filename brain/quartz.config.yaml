# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # S10 (§18): the site is "Emerson's Desk". The *header* shows the short mark
  # `EBW` — page-title has no options, so that swap lives in custom.scss §4a and
  # this value stays the site's real name, which is what <title> and the
  # accessible name of the wordmark link use.
  pageTitle: "Emerson's Desk"
  # Leading separator: Head.tsx concatenates suffix straight onto the title, so
  # without it every tab read "Emerson's DeskEmerson Black Writes".
  pageTitleSuffix: " · Emerson Black Writes"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: emersonblackwrites.com/desk
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # S6 typography — shared with the storefront (style.css) so the two
      # halves read as one site. This block is Quartz CORE's font config and
      # is the one that actually emitted the Google Fonts <link>; the
      # @quartz-community/quartz-fonts plugin emits a second, separate sheet.
      # Both are set to the same three faces deliberately: the plugin cannot be
      # relied on alone, and core's cannot be switched off. See §12.
      header: Gabarito
      body: Lora
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#F0F4F8"
        lightgray: "#A8B5C9"
        gray: "#6B7A91"
        darkgray: "#111F2E"
        dark: "#0B1926"
        secondary: "#CA2626"
        tertiary: "#CA2626"
        highlight: rgba(202, 38, 38, 0.12)
        textHighlight: "#fff23688"
      darkMode:
        light: "#060D14"
        lightgray: "#111F2E"
        gray: "#6B7A91"
        darkgray: "#A8B5C9"
        dark: "#F0F4F8"
        secondary: "#E63A3A"
        tertiary: "#E63A3A"
        highlight: rgba(230, 58, 58, 0.18)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      # `created` reads frontmatter.created, which Publish Brain.command now
      # derives from each note's `date:` field — so the archive shows real
      # publication dates instead of "today" on every mirrored note.
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: left
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      # S6 typography. The display/body/serif faces are shared with the
      # storefront (see style.css) so the two halves read as one site.
      #
      # `useThemeFonts: false` is REQUIRED, not optional. The plugin defaults it
      # to true, which makes it load the theme's own font sheet; without this
      # line the build emits TWO Google Fonts links per page — ours plus a
      # hardcoded off-brand default (Schibsted Grotesk / Source Sans Pro /
      # IBM Plex Mono) from the plugin's QUARTZ_DEFAULT_* constants. Setting
      # header/body/code alone does not remove that second sheet.
      useThemeFonts: false
      fontOrigin: googleFonts
      header:
        name: Gabarito
        weights: [400, 500, 600, 700]
      body:
        name: Lora
        weights: [400, 600]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 600]
  - source: "@quartz-themes/core"
    enabled: true
    options:
      # `emerson` is our own theme: @quartz-themes/default plus the brand
      # overlay registered in quartz/theme/emerson.ts (loaded via quartz.ts).
      # Do not change this to `default` — the accent would go Obsidian violet.
      theme: emerson
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: The Archive
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
      filterFn: (node) => node.slugSegment !== "tags"
      mapFn: |
        (node) => {
          if (!node.slugSegment && Array.isArray(node.children)) {
            const i = node.children.findIndex((c) => c && c.slugSegment === "newsletters");
            if (i >= 0) {
              const nl = node.children[i];
              node.children.splice(i, 1);
              if (nl && Array.isArray(nl.children)) node.children.push(...nl.children);
            }
          }
          return node;
        }
      order:
        - filter
        - map
        - sort
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        # S10 · show the WHOLE Desk graph on every page, not just the current
        # post's 2-hop neighbourhood. The tags (8 spheres) and wikilinks are the
        # navigation now, so the local graph's job is the *map*: you should be
        # able to see where a post sits in the whole body of work, with the
        # current node already highlighted in the accent. A high depth means
        # "show everything reachable" — the current post is the one in accent.
        depth: 100
        showTags: true
        focusOnHover: true
        fontSize: 0.8
        repelForce: 0.6
        centerForce: 0.4
        linkDistance: 40
      globalGraph:
        showTags: true
        focusOnHover: true
        fontSize: 0.8
        repelForce: 0.6
        centerForce: 0.4
        linkDistance: 40
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 25
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: left
      priority: 40
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # ── S1a: the header bar ────────────────────────────────────────────────────
  # The wordmark moves out of the left sidebar and into the header slot, so the
  # nav row and the site identity share one band across the top of the shell.
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 10
  # Footer repurposed as the nav: the plugin already renders `links` as a
  # <ul><li><a> list, which is exactly the markup a nav wants, so there is no
  # reason to write a component. It also emits a "Created with Quartz v4 © year"
  # <p>, which is upstream attribution we do not want on this site — custom.scss
  # §5 hides `header > footer > p` and nothing else, so the links still render.
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Books: https://emersonblackwrites.com/#books
        About: https://emersonblackwrites.com/bio.html
        Desk: https://emersonblackwrites.com/desk/
        Subscribe: https://emersonblackwrites.substack.com/
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: header
      priority: 35
      group: toolbar
  # S10 · breadcrumbs removed. The trail was `✦ / Newsletter Archive / 2025 /
  # <title>` — a folder-shaped way round a site that now navigates by tag
  # (§25) and by graph. It also sat ABOVE the post title, repeating the very
  # page you are on (`showCurrentPage: true`) and adding a second, older
  # navigation model beside the tags. Now that the year folders are no longer
  # how you move around, the trail has nothing left to say. Re-enable the plugin
  # if the folders ever come back as navigation.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: Latest dispatches
      limit: 5
      linkToMore: Newsletters/index
      showTags: false
      showDate: true
      # Keep folder index pages (year archives, homepage) out of the list —
      # they carry no publication date and would sort to the top.
      hideFolderPages: true
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - backlinks
      positions:
        right: []
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
