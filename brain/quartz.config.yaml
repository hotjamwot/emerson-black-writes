# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # S10 (§18): the site is "Emerson's Desk". The *header* shows the short mark
  # `EBW` — page-title has no options, so that swap lives in custom.scss §4a and
  # this value stays the site's real name, which is what <title> and the
  # accessible name of the wordmark link use.
  pageTitle: "Emerson's Desk"
  # Leading separator: Head.tsx concatenates suffix straight onto the title, so
  # without it every tab read "Emerson's DeskEmerson Black Writes".
  pageTitleSuffix: " · Emerson Black Writes"
  enableSPA: true
  # 11.9.6(b) - hover popovers OFF. These are Quartz's Obsidian-flavoured link
  # previews, and they were firing on every internal link: a box of half-rendered
  # content chasing the cursor over the archive, on a site whose whole argument is
  # that the writing is worth arriving at deliberately. It also fought the header
  # work - the popover script re-renders the listing markup the description work
  # depends on. verify-default-mode asserts the popover script is not shipped.
  enablePopovers: false
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: emersonblackwrites.com/desk
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # S6 typography — shared with the storefront (style.css) so the two
      # halves read as one site. This block is Quartz CORE's font config and
      # is the one that actually emitted the Google Fonts <link>; the
      # @quartz-community/quartz-fonts plugin emits a second, separate sheet.
      # Both are set to the same three faces deliberately: the plugin cannot be
      # relied on alone, and core's cannot be switched off. See §12.
      header: Gabarito
      body: Lora
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#F0F4F8"
        lightgray: "#A8B5C9"
        gray: "#6B7A91"
        darkgray: "#111F2E"
        dark: "#0B1926"
        secondary: "#CA2626"
        tertiary: "#CA2626"
        highlight: rgba(202, 38, 38, 0.12)
        textHighlight: "#fff23688"
      darkMode:
        light: "#060D14"
        lightgray: "#111F2E"
        gray: "#6B7A91"
        darkgray: "#A8B5C9"
        dark: "#F0F4F8"
        secondary: "#E63A3A"
        tertiary: "#E63A3A"
        highlight: rgba(230, 58, 58, 0.18)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      # `created` reads frontmatter.created, which Publish Brain.command now
      # derives from each note's `date:` field — so the archive shows real
      # publication dates instead of "today" on every mirrored note.
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # 11.9.7 - header declutter: the ToC is out. The reader wants less info in
  # the header (article header and left rail alike), so it is disabled here and
  # locked off: verify-default-mode asserts that no built page renders one.
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: left
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      # S6 typography. The display/body/serif faces are shared with the
      # storefront (see style.css) so the two halves read as one site.
      #
      # `useThemeFonts: false` is REQUIRED, not optional. The plugin defaults it
      # to true, which makes it load the theme's own font sheet; without this
      # line the build emits TWO Google Fonts links per page — ours plus a
      # hardcoded off-brand default (Schibsted Grotesk / Source Sans Pro /
      # IBM Plex Mono) from the plugin's QUARTZ_DEFAULT_* constants. Setting
      # header/body/code alone does not remove that second sheet.
      useThemeFonts: false
      fontOrigin: googleFonts
      header:
        name: Gabarito
        weights: [400, 500, 600, 700]
      body:
        name: Lora
        weights: [400, 600]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 600]
  - source: "@quartz-themes/core"
    enabled: true
    options:
      # `emerson` is our own theme: @quartz-themes/default plus the brand
      # overlay registered in quartz/theme/emerson.ts (loaded via quartz.ts).
      # Do not change this to `default` — the accent would go Obsidian violet.
      theme: emerson
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  # 11.9.10 — the retired archive URLs, kept alive as redirects rather than
  # deleted. See ./quartz/plugins/archive-redirects/index.js for why these are
  # five small files and not a 404.
  - source: "./quartz/plugins/archive-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  # F2 — no `.canvas` files exist in the vault, so this emitter produces nothing.
  # Disabled rather than left on: an enabled page emitter with no input is cruft
  # that survives every upgrade and has to be re-investigated each time.
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  # 11.9.10 — OFF, deliberately.
  #
  # This plugin auto-generates an index page for every folder on the site, which
  # is what produced /newsletters/2023/ .. 2026/: four pages whose whole content
  # was the posts in that year. Those five URLs (four years plus the
  # content/Newsletters/index.md page) are now collapsible sections at the foot
  # of /desk/, which is where a reader would look for "everything, newest first".
  #
  # Nothing else on the site depends on it. /tags/ belongs to tag-page, the
  # homepage is content/index.md, and the 49 posts are individual .md files
  # inside the year folders — they are untouched by this. verify-default-mode
  # asserts none of the five URLs is emitted and that every post still builds.
  - source: "@quartz-community/folder-page"
    enabled: false
  # 11.9.10 — the year fold-outs. Slot 9, so it sits directly under the topic
  # cards (slot 8) and reads as the page's second axis: "what is this about"
  # above, "what has he written" below.
  - source: "./quartz/plugins/year-foldouts"
    enabled: true
    layout:
      position: beforeBody
      priority: 9
  # 11.9.5(b) — descriptions on the tag listing pages, which REPLACES tag-page.
  #
  # `@quartz-community/tag-page` compiles its own copy of PageList into dist/
  # and that copy renders title/date/tags but NOT `description`, even though all
  # 51 posts carry one. It exposes no option to swap the list component, and
  # ./quartz/components/PageList.tsx has no importers — so there is nothing to
  # patch. The local plugin reimplements the page (match + generate + body +
  # tag-page's own stylesheet) and adds one `<p class="eb-listing-desc">` per entry.
  #
  # Disabled rather than shadowed: ownership of these VIRTUAL pages comes from
  # `generate()`, and the dispatcher emits each with the layout of the page type
  # that generated it. Two page types generating the same slugs would just
  # overwrite each other's output.
  - source: "@quartz-community/tag-page"
    enabled: false
  - source: "./quartz/plugins/listing-descriptions"
    enabled: true
  # 12.1(c) — the year folders, back as reading rooms. Replaces the four year
  # redirect stubs (the sidebar builds its tree from the file tree, so it kept
  # advertising folders whose pages bounced). Same pageType pattern as
  # listing-descriptions: generate() claims newsletters/<year> as virtual pages,
  # one per year derived from the posts' own dates.
  - source: "./quartz/plugins/year-archives"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: The Archive
      folderDefaultState: collapsed
      folderClickBehavior: link
      useSavedState: true
      filterFn: (node) => node.slugSegment !== "tags"
      mapFn: |
        (node) => {
          if (!node.slugSegment && Array.isArray(node.children)) {
            const i = node.children.findIndex((c) => c && c.slugSegment === "newsletters");
            if (i >= 0) {
              const nl = node.children[i];
              node.children.splice(i, 1);
              if (nl && Array.isArray(nl.children)) node.children.push(...nl.children);
            }
          }
          return node;
        }
      order:
        - filter
        - map
        - sort
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        # S10 · show the WHOLE Desk graph on every page, not just the current
        # post's 2-hop neighbourhood. The tags (8 spheres) and wikilinks are the
        # navigation now, so the local graph's job is the *map*: you should be
        # able to see where a post sits in the whole body of work, with the
        # current node already highlighted in the accent. A high depth means
        # "show everything reachable" — the current post is the one in accent.
        depth: 100
        showTags: true
        focusOnHover: true
        fontSize: 0.8
        repelForce: 0.6
        centerForce: 0.4
        linkDistance: 40
      globalGraph:
        showTags: true
        focusOnHover: true
        fontSize: 0.8
        repelForce: 0.6
        centerForce: 0.4
        linkDistance: 40
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 25
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: left
      priority: 40
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # 11.9.5(c) - the description, as a standfirst under the post title.
  #
  # This is the gap that made 11.9.5(a) and (b) look like the feature "never
  # worked": the text appears on /desk/ and on /tags/<x>/, and was in every
  # built page's <meta name="description">, but open an actual POST and the
  # header went title -> dates -> topics with the one sentence that says what
  # the piece is about never rendered.
  #
  # Slot 15 puts it directly under article-title (10) and above post-dates
  # (25): it is the sentence that sets the post up, so it reads before the
  # metadata rather than as a footnote to it.
  - source: "./quartz/plugins/post-deck"
    enabled: true
    layout:
      position: beforeBody
      priority: 15
  - source: "./quartz/plugins/post-dates"
    enabled: true
    layout:
      position: beforeBody
      # Sits under the title, above the tag pills: Published/Updated first, then
      # the topics (tag-list at 30; content-meta's 20 slot is retired, 11.9.7).
      priority: 25
  # 11.9.7 - content-meta is disabled outright. Under the title it printed the
  # publication date plus a reading time ("Feb 14, 2025 / 8 min read") beside
  # the post header's "Published ... | Updated ...", so the same date appeared
  # twice, stacked. The S10 compromise (hide the date, keep the reading time)
  # had been matching nothing: its rule got nested inside .eb-post-dates, so it
  # compiled to a selector no page can have. Both fields go - the dates are the
  # post-dates component's job, and the reader wants the bare header: title,
  # Published/Updated, topics.
  - source: "@quartz-community/content-meta"
    enabled: false
    options:
      showReadingTime: true
      showComma: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # ── S1a: the header bar ────────────────────────────────────────────────────
  # 11.9.6: the wordmark is our own `Wordmark` component (./quartz/plugins/
  # wordmark) — the storefront's two-line stacked mark linking to `/`.
  # `@quartz-community/page-title` has no options and links back into /desk/;
  # 11.9.8 (wordmark → /) is the link target, so the swap is structural, not
  # presentational. The accessible name stays "Emerson Black — home" and the
  # series line is aria-hidden (decorative twin of the name).
  - source: "./quartz/plugins/wordmark"
    enabled: true
    layout:
      position: header
      priority: 10
  # Footer repurposed as the nav: the plugin already renders `links` as a
  # <ul><li><a> list, which is exactly the markup a nav wants, so there is no
  # reason to write a component. 11.9.6: order mirrors the storefront
  # (Books / Desk / About / Subscribe) so the two headers read as one.
  # About points at the homepage #about section (bio.html is a redirect stub,
  # not a destination). It also emits a "Created with Quartz v4 © year"
  # <p>, which is upstream attribution we do not want on this site — custom.scss
  # §5 hides `header > footer > p` and nothing else, so the links still render.
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Books: https://emersonblackwrites.com/#books
        Desk: https://emersonblackwrites.com/desk/
        About: https://emersonblackwrites.com/#about
        Subscribe: https://emersonblackwrites.substack.com/
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  # 11.9.7f - Reader mode is out, at EVERY width. The reader called it "the
  # little book icon" and asked for it gone; 11.9.7d had already hidden it below
  # 800px but it was still in the desktop header next to search and the theme
  # toggle. Disabling the plugin removes the button and its markup rather than
  # hiding it with CSS - a display:none control is still in the tab order and
  # still keyboard-reachable, which is worse than absent. custom.scss keeps its
  # `.readermode` hide rule; harmless, and it keeps mobile correct if this ever
  # comes back.
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: header
      priority: 35
      group: toolbar
  # S10 · breadcrumbs removed. The trail was `✦ / Newsletter Archive / 2025 /
  # <title>` — a folder-shaped way round a site that now navigates by tag
  # (§25) and by graph. It also sat ABOVE the post title, repeating the very
  # page you are on (`showCurrentPage: true`) and adding a second, older
  # navigation model beside the tags. Now that the year folders are no longer
  # how you move around, the trail has nothing left to say. Re-enable the plugin
  # if the folders ever come back as navigation.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  # 11.9.5(a) - the hub. INDEX ONLY.
  #
  # /desk/ stays (it is the archive and the sitemap/backlink target), but it
  # needs a front door: one card per topic, five most recent posts in each,
  # with the description that made each post worth clicking.
  #
  # `condition: is-index` is load-bearing, not tidy-up. The component emits
  # "./" + slug links, which are correct from the index and wrong anywhere
  # else - a plain-JS local plugin cannot import quartz's resolveRelative, so
  # correctness here comes from the component being confined to one page.
  #
  # It is spelled `is-index`, NOT `index`: `index` is not a condition, and an
  # unrecognised condition name resolves to undefined and is SILENTLY IGNORED,
  # so the hub rendered on every page of every page type with no error
  # anywhere. The positive form did not exist and was added in
  # quartz/plugins/loader/conditions.ts. The component ALSO self-guards on
  # `fileData.slug !== "index"`, so this cannot regress silently a second way.
  # verify-default-mode asserts the hub is on the index and on no other page.
  # 12.7 — "Latest dispatches", the FIRST thing in the body.
  #
  # The reader arrives at /desk/ wanting the newest writing and works backwards.
  # Until this, both sections on the page were thematic (topic cards = "what is
  # this about", fold-outs = "browse the archive"), so the one chronological
  # question had no answer in the reading order. Priority 4 puts this above
  # tag-hub (8) and year-foldouts, directly under the standfirst.
  #
  # `condition: is-index` is DECORATIVE here, exactly as it is on tag-hub and
  # year-foldouts: Quartz does not know that condition name, so it resolves to
  # undefined and is silently ignored. The component's own
  # `fileData?.slug !== "index"` guard is what actually holds it to the Desk.
  # verify-default-mode asserts it renders on the index and on no other page.
  - source: "./quartz/plugins/eb-latest"
    enabled: true
    layout:
      position: beforeBody
      priority: 4
      condition: is-index
  - source: "./quartz/plugins/tag-hub"
    enabled: true
    layout:
      position: beforeBody
      priority: 8
      condition: is-index
  # §11.6 — the door from a dispatch to the books.
  #
  # `afterBody`, so the card sits at the END of the post: a reader has finished
  # the argument by then, which is the only moment naming a book is welcome
  # rather than an interruption. Priority 5 puts it above the (disabled)
  # comments slot and directly under the article.
  #
  # There is deliberately NO `condition: is-index` here, unlike eb-latest and
  # tag-hub — this one is meant to run on EVERY post and nowhere else. The
  # component's own slug guard is what holds it to real dispatches: the Desk's
  # slug is "index" and a folder page's ends in "/", and either would otherwise
  # grow a card about a book that the page never mentioned.
  - source: "./quartz/plugins/eb-book-mentions"
    enabled: true
    layout:
      position: afterBody
      priority: 5
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # 11.9.10 — this was `Newsletters/index`, the archive page that is now gone.
  #
  # It is `false` and NOT a link to the year fold-outs, on purpose. This
  # component's overflow line reads `allFiles.length - limit`, and allFiles holds
  # nine virtual /tags/ pages plus content/index.md itself, so any number it
  # renders counts FILES rather than dispatches: the page said "See 45 more"
  # against 49 posts shown five at a time, which is 44. `hideTagPages` removes the
  # nine and is worth having regardless, but the Desk's own row is left over — and
  # `filter` is a function that a YAML config cannot honestly express. A wrapper
  # plugin supplying it was tried and removed: it did not resolve through the
  # component registry and silently took the whole list off the page, which is
  # worse than a wrong number.
  #
  # So there is no overflow link here, and nothing on the page states a number this
  # component cannot state correctly. The archive is reached by the "Browse the
  # archive" button above, which jumps to the fold-outs, and the honest total
  # lives in that section's own heading.
  # 12.7 — DISABLED, and deliberately replaced by ./quartz/plugins/eb-latest.
  #
  # This component WAS enabled and WAS rendering, and it is the reason the Desk
  # gave no answer to "what is newest". Measured in the built index.html: its
  # markup sat at offset ~48465, inside the sidebar's graph container — after
  # the topic cards, after the fold-outs, off the reading path entirely. The
  # reader's own report was that they scroll past the topic cards to the years
  # looking for recent posts; the answer was on the page the whole time, in the
  # sidebar, below everything.
  #
  # It is turned off rather than restyled because it cannot do what this needs
  # in the body: `recent-notes` has no `beforeBody` priority that lands it
  # above the hub, and it drops the `description` field, leaving bare titles —
  # which is precisely the complaint 11.9.11 already fixed in the year rows.
  # eb-latest renders in reading order, above the cards, with standfirsts.
  #
  # Turning this off also removes a second copy of "Latest dispatches" from the
  # Desk: with eb-latest present, the sidebar orphan would be a duplicate list
  # of the same five posts about 30,000 characters further down the document.
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      title: Latest dispatches
      limit: 5
      linkToMore: false
      showTags: false
      showDate: true
      # Keep folder index pages (year archives, homepage) out of the list —
      # they carry no publication date and would sort to the top.
      hideFolderPages: true
      # 11.9.10 — the tag pages too. They are virtual and carry no publication
      # date, so they were never candidates for this list, only for its arithmetic.
      hideTagPages: true
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  # F3 — no `.base` files exist, so this emits no `/bases` route. Same reasoning
  # as canvas-page (F2) directly above.
  - source: "@quartz-community/bases-page"
    enabled: false
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  # F4 — no `.excalidraw` drawings exist, so this transforms nothing. Same
  # reasoning as canvas-page (F2).
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - backlinks
      positions:
        right: []
    year:
      exclude:
        - reader-mode
      positions:
        right: []
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
