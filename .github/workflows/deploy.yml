name: Deploy Storefront and Desk to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./brain
        run: npm ci

      - name: Build Quartz (Brain)
        working-directory: ./brain
        run: npx quartz build

      - name: Assemble site artifact
        run: |
          # S10: the Desk is served at /desk/ (was /brain/). The Quartz SOURCE
          # directory stays `brain/` — renaming it would touch npm ci, both
          # .command scripts and every path in the plan for no user-visible gain;
          # the URL is what readers see.
          mkdir -p _site/desk
          # Copy storefront root files and directories
          cp index.html bio.html CNAME style.css README.md _site/
          cp -R img _site/
          # S11 §11.3: post dates for the storefront's "From the Desk" section.
          # MUST run BEFORE the Quartz copy below. Upstream's contentIndex.json
          # deletes the date on purpose, so this writes a separate purpose-built
          # file — and it lands in brain/public/static/, which is only copied into
          # _site/desk/ by a later command. Generating it after that copy wrote
          # the file to a directory that had already been copied, and it silently
          # never reached the artifact.
          #
          # It reads FRONTMATTER, not the rendered <time datetime>: that attribute
          # is parsed as UTC midnight and so reads a day EARLIER than the date
          # shown on the page (frontmatter 2025-02-14 renders as Feb 14 while
          # datetime="2025-02-13T21:00Z").
          node brain/scripts/export-post-dates.mjs brain brain/public
          # S11 §11.3b: render the storefront's "Latest" desk picks.
          # ⚠️ MUST RUN AFTER export-post-dates (above). It READS
          # brain/public/static/postDates.json, which the Quartz build does not
          # produce — running it first dies with ENOENT. This shipped once
          # because postDates.json already existed locally from an earlier build,
          # so the script appeared to work; only a CLEAN CLONE exposed it. Always
          # reproduce a deploy from a fresh clone, never from a working copy.
          #
          # It operates on the _site COPY, never the source index.html, so no
          # snapshot of "latest" is ever committed. Idempotent, so a no-op rebuild
          # is a clean pass rather than a failed deploy.
          node brain/scripts/render-desk-picks.mjs brain brain/public _site/index.html
          # Copy Quartz build output to /desk/
          cp -R brain/public/. _site/desk/
          # Remove duplicate CNAME created by Quartz inside /desk/
          rm -f _site/desk/CNAME
          # Legacy /brain/ -> /desk/. /brain/ was never launched, so this is
          # insurance for a bookmark or an external link taken before the move,
          # and it costs one file. Written here rather than as a content/brain.md
          # alias because Quartz now BUILDS into /desk/, so an alias page would
          # emit at /desk/brain/ — the wrong side of the move entirely.
          mkdir -p _site/brain
          printf '%s' '<!doctype html><meta charset="utf-8"><title>Moved: Emerson&#8217;s Desk</title><link rel="canonical" href="https://emersonblackwrites.com/desk/"><meta http-equiv="refresh" content="0; url=/desk/"><p>Emerson&#8217;s Desk now lives at <a href="/desk/">/desk/</a>.</p>' > _site/brain/index.html
          # S11 §11.1: sitemap + robots.txt. Generated from the ASSEMBLED _site
          # tree (not hand-maintained) so it can never disagree with what was
          # actually shipped — a stale sitemap is worse than none, and the site
          # had none at all until now. Must run after Quartz is copied in.
          node brain/scripts/generate-sitemap.mjs _site
          # Disable Jekyll processing. Pages "Source" MUST be "GitHub Actions";
          # this file is belt-and-braces so the artifact can never be chewed up
          # by the legacy Jekyll pipeline if it is ever served from a branch.
          touch _site/.nojekyll
          # Belt-and-braces: never ship macOS junk, even if one is ever committed.
          find _site -name '.DS_Store' -delete

      - name: Guard checks
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "::error::Guard failure: _site/index.html missing! Deployment aborted."
            exit 1
          fi
          if [ ! -f "_site/CNAME" ]; then
            echo "::error::Guard failure: _site/CNAME missing! Deployment aborted."
            exit 1
          fi
          if [ ! -f "_site/desk/index.html" ]; then
            echo "::error::Guard failure: _site/desk/index.html missing! Deployment aborted."
            exit 1
          fi
          # S10: the legacy /brain/ stub must exist AND point at /desk/, so a
          # rename can never quietly 404 the old path. grep fails closed on a
          # missing file, which is the behaviour we want.
          if ! grep -q 'url=/desk/' _site/brain/index.html; then
            echo "::error::Guard failure: legacy /brain/ redirect stub missing or not pointing at /desk/! Deployment aborted."
            exit 1
          fi
          if [ ! -f "_site/.nojekyll" ]; then
            echo "::error::Guard failure: _site/.nojekyll missing! Deployment aborted."
            exit 1
          fi
          # Content guard: an empty garden must never look like a successful build.
          PAGE_COUNT=$(find _site/desk/newsletters -name '*.html' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PAGE_COUNT" -lt 1 ]; then
            echo "::error::Guard failure: no Quartz newsletter pages in _site/desk/newsletters/! Deployment aborted."
            exit 1
          fi
          IMG_COUNT=$(find _site/desk/organise/images -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IMG_COUNT" -lt 1 ]; then
            echo "::error::Guard failure: no newsletter images in _site/desk/organise/images/! Deployment aborted."
            exit 1
          fi
          echo "Guard: $PAGE_COUNT newsletter pages and $IMG_COUNT image files staged."
          # S11 §11.1: findability guards. The storefront shipped for years with
          # no meta description, no og: tags, no sitemap and no robots.txt — the
          # likely reason the site looked unread. These assert they exist, so the
          # fix cannot silently regress the way the yellow-highlight guard did
          # (see the F13 lesson: a check that cannot fail is worse than none).
          for f in sitemap.xml robots.txt; do
            if [ ! -s "_site/$f" ]; then
              echo "::error::Guard failure: _site/$f missing or empty! Deployment aborted."
              exit 1
            fi
          done
          # ⚠️ index.html ONLY. bio.html is deliberately EXCLUDED: it is now a
          # redirect stub to the homepage's #about section (S11 §11.3c) and
          # carries noindex + a canonical pointing at the homepage. Demanding a
          # meta description and og:title of a page that must never appear in
          # search results would be demanding the opposite of what it is for.
          # It is still checked below — for being a redirect.
          for f in index.html; do
            if ! grep -q '<meta name="description"' "_site/$f"; then
              echo "::error::Guard failure: _site/$f has no meta description! Deployment aborted."
              exit 1
            fi
            if ! grep -q 'property="og:title"' "_site/$f"; then
              echo "::error::Guard failure: _site/$f has no og:title! Deployment aborted."
              exit 1
            fi
            if ! grep -q 'rel="canonical"' "_site/$f"; then
              echo "::error::Guard failure: _site/$f has no canonical URL! Deployment aborted."
              exit 1
            fi
          done
          # bio.html must remain a working redirect, not a silently-deleted URL.
          # It is a live link an agent may have bookmarked; if someone removes
          # this file, that URL becomes a 404 and nothing else would notice.
          if [ ! -s "_site/bio.html" ]; then
            echo "::error::Guard failure: bio.html missing — /bio.html would 404 for anyone who bookmarked it! Deployment aborted."
            exit 1
          fi
          for needle in 'http-equiv="refresh"' 'noindex' '<noscript>'; do
            if ! grep -q -- "$needle" _site/bio.html; then
              echo "::error::Guard failure: bio.html is missing $needle — it must remain a safe redirect! Deployment aborted."
              exit 1
            fi
          done
          # The sitemap must actually list the archive, not just exist. A
          # sitemap.xml containing one URL is technically valid and useless.
          SITEMAP_POSTS=$(grep -c '/desk/newsletters/' _site/sitemap.xml || true)
          if [ "$SITEMAP_POSTS" -lt 40 ]; then
            echo "::error::Guard failure: sitemap lists only $SITEMAP_POSTS posts (expected 49)! Deployment aborted."
            exit 1
          fi
          echo "Guard: sitemap lists $SITEMAP_POSTS posts; meta + og + canonical on index.html; bio.html is a safe redirect."
          # S11 §11.4: the header nav is in-page anchors, so a renamed section id
          # silently breaks navigation — the link still renders, it just goes
          # nowhere. A nav that does nothing looks like a broken site and is the
          # single most likely thing to rot in a one-page design.
          NAV_TARGETS="top books desk about characters start-reading"
          for t in $NAV_TARGETS; do
            if ! grep -q "id=\"$t\"" _site/index.html; then
              echo "::error::Guard failure: nav target #$t does not exist in index.html — a header link would go nowhere! Deployment aborted."
              exit 1
            fi
          done
          echo "Guard: all $(( $(echo $NAV_TARGETS | wc -w) )) nav anchors resolve to real sections."
          # S11 §11.3: the date export must be non-trivial AND correctly ordered.
          # Existence alone proves nothing — an empty array or an unsorted list
          # would both pass a file-exists check and both break the storefront's
          # "latest posts" strip silently. Parsed with node because jq is not
          # guaranteed on the runner image.
          if [ ! -s "_site/desk/static/postDates.json" ]; then
            echo "::error::Guard failure: _site/desk/static/postDates.json missing or empty! Deployment aborted."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("_site/desk/static/postDates.json", "utf8"));
            if (!Array.isArray(p)) { console.error("::error::postDates.json is not an array"); process.exit(1); }
            if (p.length < 40) { console.error(`::error::only ${p.length} posts dated (expected 49)`); process.exit(1); }
            const bad = p.filter((x) => !/^\d{4}-\d{2}-\d{2}$/.test(x.date || ""));
            if (bad.length) { console.error(`::error::${bad.length} entries have a malformed date`); process.exit(1); }
            const dates = p.map((x) => x.date);
            const sorted = [...dates].sort().reverse();
            if (JSON.stringify(dates) !== JSON.stringify(sorted)) {
              console.error("::error::postDates.json is not newest-first");
              process.exit(1);
            }
            console.log(`Guard: ${p.length} dated posts, newest ${dates[0]}, oldest ${dates[dates.length-1]}.`);
          '
          echo "All safety guard checks passed."
          # S11 §11.3b: the Desk section must be RENDERED, not a stub. A
          # placeholder surviving into the artifact would ship a section that
          # says "Browse all {{DESK_COUNT}} notes" — visibly broken, and the
          # kind of thing that reaches production because nobody looks at the
          # bottom of the homepage.
          if grep -q '{{DESK_COUNT}}' _site/index.html; then
            echo "::error::Guard failure: {{DESK_COUNT}} placeholder shipped to production! Deployment aborted."
            exit 1
          fi
          # 12.7 — the Desk section is now ONE automatic topic strip plus the
          # generated latest picks. The hand-written "Start here" trio is gone,
          # so the old "exactly 6 = 3 curated + 3 latest" arithmetic could not
          # be kept by changing the numbers: it described a split that no longer
          # exists, and a guard that outlives its feature is how this repo got
          # its "See 45 more" incident. So it is rewritten around what the
          # section now owes the reader.
          #
          # The counts are asserted as MINIMUMS, not exact numbers. An exact
          # count is a number that has to be edited every time a post is
          # written, which is the upkeep this change exists to remove; a floor
          # still catches the only failure that matters — a strip that rendered
          # empty or collapsed to one topic.
          TOPIC_COUNT=$(sed -n '/id="desk-topics"/,/<\/div>/p' _site/index.html | grep -c 'class="desk-topic"' || true)
          if [ "$TOPIC_COUNT" -lt 3 ]; then
            echo "::error::Guard failure: topic strip rendered only $TOPIC_COUNT topics! Deployment aborted."
            exit 1
          fi
          # And every one must link to a tag page that EXISTS. The old guard
          # counted links matching a URL SHAPE, which cannot distinguish a live
          # page from a dead one — a renamed tag passed it. This resolves each
          # href against the built tag pages.
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("_site/index.html", "utf8");
            const strip = (html.match(/<div class="desk-topics-strip" id="desk-topics">([\s\S]*?)<\/div>/) || [])[1] || "";
            const tags = [...strip.matchAll(/href="\/desk\/tags\/([^"]+)"/g)].map((m) => m[1]);
            if (tags.length < 3) { console.error(`::error::only ${tags.length} topic links in the strip`); process.exit(1); }
            const missing = tags.filter((t) => !fs.existsSync(`_site/desk/tags/${t}.html`));
            if (missing.length) {
              console.error(`::error::topic strip links to ${missing.length} tag page(s) that do not exist: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`Guard: topic strip — ${tags.length} topics, every tag page exists.`);
          '
          LATEST_COUNT=$(sed -n '/id="desk-latest"/,/<\/div>/p' _site/index.html | grep -c 'class="desk-pick"' || true)
          if [ "$LATEST_COUNT" -lt 3 ]; then
            echo "::error::Guard failure: expected at least 3 generated latest picks, found $LATEST_COUNT! Deployment aborted."
            exit 1
          fi
          # Every latest pick must be a real, reachable Desk URL.
          LATEST_BROKEN=$(sed -n '/id="desk-latest"/,/<\/div>/p' _site/index.html | grep -oE 'class="desk-pick" href="[^"]*"' | grep -cE 'href="/desk/newsletters/[0-9]{4}/' || true)
          if [ "$LATEST_BROKEN" -ne "$LATEST_COUNT" ]; then
            echo "::error::Guard failure: only $LATEST_BROKEN/$LATEST_COUNT latest picks point at a dated post URL! Deployment aborted."
            exit 1
          fi
          # The hand-written trio must NOT come back. It is the one piece of this
          # section that needed a human, and a guard that only checks for what is
          # present cannot notice it returning.
          #
          # ⚠️ Matches the RENDERED markup, not the raw file: index.html's own
          # comment explains that 12.7 removed this trio, and grepping raw HTML
          # reports that comment as the feature coming back (the I9 lesson).
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("_site/index.html", "utf8").replace(/<!--[\s\S]*?-->/g, "");
            if (/Start here/.test(html)) {
              console.log("::warning::The Start here trio is back in the rendered homepage - 12.7 removed it as the last hand-maintained list.");
            }
          '
          echo "Guard: desk section rendered ($TOPIC_COUNT topics + $LATEST_COUNT latest), no placeholders."

      # S11 §11.9: the storefront, measured AS RENDERED rather than as written.
      # Three visual regressions shipped in the §11.3c rehaul (I10) — a hero that
      # was not full-width, a section rhythm that vanished, and a cover that
      # rendered as a strip — and every check at the time read the source. The CSS
      # was correct as written in all three cases; the rendered box was wrong.
      #
      # Its static tier always runs. Its browser tier runs whenever Chrome is on
      # the runner (it is, on ubuntu-latest) and aborts on a real geometry
      # regression; if Chrome is ever missing it says so loudly and skips, because
      # "cannot measure here" is not evidence of a failed guard, whereas
      # "measured, and wrong" is.
      - name: Storefront geometry check (rendered)
        run: node brain/scripts/verify-storefront.mjs _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Post-deploy smoke test. Non-fatal: it never unships a good build, but it
      # shouts loudly if the live /desk/ is not the Quartz output. The classic
      # failure it catches: Settings -> Pages -> Source set to "Deploy from a
      # branch", where the platform's Jekyll build overwrites this deployment.
      - name: Smoke test live site
        if: always()
        run: |
          URL="https://www.emersonblackwrites.com/desk/"
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -sS -m 20 -H 'Cache-Control: no-cache' "${URL}?smoke=${attempt}-${RANDOM}" || true)
            if printf '%s' "$BODY" | grep -q 'id="quartz-root"'; then
              echo "OK: ${URL} is serving the Quartz build (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: Quartz markers not found yet; retrying in 15s..."
            sleep 15
          done
          echo "::warning::${URL} does not look like the Quartz build."
          echo "::warning::Fix: repo Settings -> Pages -> Build and deployment -> Source = 'GitHub Actions'."
          echo "::warning::If Source is 'Deploy from a branch', GitHub's own Jekyll build overwrites every deploy-pages artifact."
          exit 0
