name: Deploy Storefront and Desk to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./brain
        run: npm ci

      - name: Build Quartz (Brain)
        working-directory: ./brain
        run: npx quartz build

      - name: Assemble site artifact
        run: |
          # S10: the Desk is served at /desk/ (was /brain/). The Quartz SOURCE
          # directory stays `brain/` — renaming it would touch npm ci, both
          # .command scripts and every path in the plan for no user-visible gain;
          # the URL is what readers see.
          mkdir -p _site/desk
          # Copy storefront root files and directories
          cp index.html bio.html CNAME style.css README.md _site/
          cp -R img _site/
          # Copy Quartz build output to /desk/
          cp -R brain/public/. _site/desk/
          # Remove duplicate CNAME created by Quartz inside /desk/
          rm -f _site/desk/CNAME
          # Legacy /brain/ -> /desk/. /brain/ was never launched, so this is
          # insurance for a bookmark or an external link taken before the move,
          # and it costs one file. Written here rather than as a content/brain.md
          # alias because Quartz now BUILDS into /desk/, so an alias page would
          # emit at /desk/brain/ — the wrong side of the move entirely.
          mkdir -p _site/brain
          printf '%s' '<!doctype html><meta charset="utf-8"><title>Moved: Emerson&#8217;s Desk</title><link rel="canonical" href="https://emersonblackwrites.com/desk/"><meta http-equiv="refresh" content="0; url=/desk/"><p>Emerson&#8217;s Desk now lives at <a href="/desk/">/desk/</a>.</p>' > _site/brain/index.html
          # S11 §11.1: sitemap + robots.txt. Generated from the ASSEMBLED _site
          # tree (not hand-maintained) so it can never disagree with what was
          # actually shipped — a stale sitemap is worse than none, and the site
          # had none at all until now. Must run after Quartz is copied in.
          node brain/scripts/generate-sitemap.mjs _site
          # Disable Jekyll processing. Pages "Source" MUST be "GitHub Actions";
          # this file is belt-and-braces so the artifact can never be chewed up
          # by the legacy Jekyll pipeline if it is ever served from a branch.
          touch _site/.nojekyll
          # Belt-and-braces: never ship macOS junk, even if one is ever committed.
          find _site -name '.DS_Store' -delete

      - name: Guard checks
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "::error::Guard failure: _site/index.html missing! Deployment aborted."
            exit 1
          fi
          if [ ! -f "_site/CNAME" ]; then
            echo "::error::Guard failure: _site/CNAME missing! Deployment aborted."
            exit 1
          fi
          if [ ! -f "_site/desk/index.html" ]; then
            echo "::error::Guard failure: _site/desk/index.html missing! Deployment aborted."
            exit 1
          fi
          # S10: the legacy /brain/ stub must exist AND point at /desk/, so a
          # rename can never quietly 404 the old path. grep fails closed on a
          # missing file, which is the behaviour we want.
          if ! grep -q 'url=/desk/' _site/brain/index.html; then
            echo "::error::Guard failure: legacy /brain/ redirect stub missing or not pointing at /desk/! Deployment aborted."
            exit 1
          fi
          if [ ! -f "_site/.nojekyll" ]; then
            echo "::error::Guard failure: _site/.nojekyll missing! Deployment aborted."
            exit 1
          fi
          # Content guard: an empty garden must never look like a successful build.
          PAGE_COUNT=$(find _site/desk/newsletters -name '*.html' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PAGE_COUNT" -lt 1 ]; then
            echo "::error::Guard failure: no Quartz newsletter pages in _site/desk/newsletters/! Deployment aborted."
            exit 1
          fi
          IMG_COUNT=$(find _site/desk/organise/images -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IMG_COUNT" -lt 1 ]; then
            echo "::error::Guard failure: no newsletter images in _site/desk/organise/images/! Deployment aborted."
            exit 1
          fi
          echo "Guard: $PAGE_COUNT newsletter pages and $IMG_COUNT image files staged."
          # S11 §11.1: findability guards. The storefront shipped for years with
          # no meta description, no og: tags, no sitemap and no robots.txt — the
          # likely reason the site looked unread. These assert they exist, so the
          # fix cannot silently regress the way the yellow-highlight guard did
          # (see the F13 lesson: a check that cannot fail is worse than none).
          for f in sitemap.xml robots.txt; do
            if [ ! -s "_site/$f" ]; then
              echo "::error::Guard failure: _site/$f missing or empty! Deployment aborted."
              exit 1
            fi
          done
          for f in index.html bio.html; do
            if ! grep -q '<meta name="description"' "_site/$f"; then
              echo "::error::Guard failure: _site/$f has no meta description! Deployment aborted."
              exit 1
            fi
            if ! grep -q 'property="og:title"' "_site/$f"; then
              echo "::error::Guard failure: _site/$f has no og:title! Deployment aborted."
              exit 1
            fi
            if ! grep -q 'rel="canonical"' "_site/$f"; then
              echo "::error::Guard failure: _site/$f has no canonical URL! Deployment aborted."
              exit 1
            fi
          done
          # The sitemap must actually list the archive, not just exist. A
          # sitemap.xml containing one URL is technically valid and useless.
          SITEMAP_POSTS=$(grep -c '/desk/newsletters/' _site/sitemap.xml || true)
          if [ "$SITEMAP_POSTS" -lt 40 ]; then
            echo "::error::Guard failure: sitemap lists only $SITEMAP_POSTS posts (expected 49)! Deployment aborted."
            exit 1
          fi
          echo "Guard: sitemap lists $SITEMAP_POSTS posts; meta + og + canonical present on both storefront pages."
          echo "All safety guard checks passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Post-deploy smoke test. Non-fatal: it never unships a good build, but it
      # shouts loudly if the live /desk/ is not the Quartz output. The classic
      # failure it catches: Settings -> Pages -> Source set to "Deploy from a
      # branch", where the platform's Jekyll build overwrites this deployment.
      - name: Smoke test live site
        if: always()
        run: |
          URL="https://www.emersonblackwrites.com/desk/"
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -sS -m 20 -H 'Cache-Control: no-cache' "${URL}?smoke=${attempt}-${RANDOM}" || true)
            if printf '%s' "$BODY" | grep -q 'id="quartz-root"'; then
              echo "OK: ${URL} is serving the Quartz build (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: Quartz markers not found yet; retrying in 15s..."
            sleep 15
          done
          echo "::warning::${URL} does not look like the Quartz build."
          echo "::warning::Fix: repo Settings -> Pages -> Build and deployment -> Source = 'GitHub Actions'."
          echo "::warning::If Source is 'Deploy from a branch', GitHub's own Jekyll build overwrites every deploy-pages artifact."
          exit 0
